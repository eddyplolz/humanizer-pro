name: Humanizer Pro audit
description: Audit Markdown and text for AI-writing tells and leaked chatbot artifacts, with SARIF output for code scanning.
author: Humanizer Pro contributors
branding:
  icon: edit-3
  color: gray-dark

inputs:
  paths:
    description: Files or directories to audit, separated by spaces or newlines.
    required: false
    default: "."
  fail-on:
    description: "Which outcome fails the step: block (exit 2 only), review (exit 1 or 2), or never."
    required: false
    default: block
  fail-score:
    description: Risk score that counts as review (exit 1). Empty means 60, or the register's threshold.
    required: false
    default: ""
  register:
    description: "Kind of writing, which sets the review threshold: chat or docs (20), or commit, essay, news, or wiki (60). Empty means 60."
    required: false
    default: ""
  sarif-file:
    description: Where to write the SARIF log. Empty to skip.
    required: false
    default: humanizer-audit.sarif
  include-code:
    description: Set to "true" to apply prose rules inside code too.
    required: false
    default: "false"

outputs:
  exit-code:
    description: "The audit exit code: 0 pass, 1 review, 2 block, 3 usage, read, or write error."
    value: ${{ steps.audit.outputs.exit-code }}
  sarif-file:
    description: Path of the SARIF log, if written.
    value: ${{ steps.audit.outputs.sarif-file }}

runs:
  using: composite
  steps:
    - id: audit
      shell: bash
      # Inputs travel as environment variables, never interpolated into the
      # script, so a crafted input cannot inject shell.
      env:
        HA_SCRIPT: ${{ github.action_path }}/scripts/humanizer_audit.py
        HA_PATHS: ${{ inputs.paths }}
        HA_FAIL_ON: ${{ inputs.fail-on }}
        HA_FAIL_SCORE: ${{ inputs.fail-score }}
        HA_REGISTER: ${{ inputs.register }}
        HA_SARIF: ${{ inputs.sarif-file }}
        HA_INCLUDE_CODE: ${{ inputs.include-code }}
      run: |
        set -u
        # Check fail-on before the audit runs, so a typo fails fast and leaves
        # no outputs or SARIF file behind.
        case "$HA_FAIL_ON" in
          never) threshold=99 ;;
          review) threshold=1 ;;
          block) threshold=2 ;;
          *) echo "::error::fail-on must be block, review, or never (got '$HA_FAIL_ON')"; exit 3 ;;
        esac
        # The first candidate that can run a one-liner wins. On a Windows
        # runner "python3" can be the Microsoft Store alias, which is on
        # PATH but only prints a hint and exits 49.
        python_bin=""
        for candidate in python3 python; do
          if "$candidate" -c "import sys" > /dev/null 2>&1; then python_bin="$candidate"; break; fi
        done
        if [ -z "$python_bin" ]; then echo "::error::no working python3 or python on PATH"; exit 3; fi
        args=()
        if [ -n "$HA_FAIL_SCORE" ]; then args+=(--fail-score "$HA_FAIL_SCORE"); fi
        if [ -n "$HA_REGISTER" ]; then args+=(--register "$HA_REGISTER"); fi
        if [ -n "$HA_SARIF" ]; then
          # Never publish a SARIF file left over from an earlier run.
          rm -f -- "$HA_SARIF"
          args+=(--sarif "$HA_SARIF")
        fi
        if [ "$HA_INCLUDE_CODE" = "true" ]; then args+=(--include-code); fi
        # Split on spaces, tabs, and newlines (a multi-line `paths: |` works),
        # with globbing off so patterns are passed through literally.
        set -f
        # shellcheck disable=SC2206
        targets=($HA_PATHS)
        set +f
        if [ "${#targets[@]}" -eq 0 ]; then targets=(.); fi
        # The report quotes file names and text from the audited files. Pause
        # workflow-command parsing around it, so a crafted line in a pull
        # request cannot set outputs, mask values, or add annotations.
        stop_token="$("$python_bin" -c "import secrets; print(secrets.token_hex(16))")"
        echo "::stop-commands::$stop_token"
        set +e
        # ${args[@]+...} keeps an empty list safe under set -u on bash 3.2 (macOS).
        "$python_bin" "$HA_SCRIPT" "${targets[@]}" ${args[@]+"${args[@]}"}
        code=$?
        set -e
        echo "::$stop_token::"
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        if [ -n "$HA_SARIF" ] && [ -f "$HA_SARIF" ]; then
          echo "sarif-file=$HA_SARIF" >> "$GITHUB_OUTPUT"
        fi
        if [ "$code" -ge 3 ]; then
          echo "::error::humanizer-audit could not run (exit $code)"
          exit "$code"
        fi
        if [ "$code" -ge "$threshold" ]; then
          exit "$code"
        fi
