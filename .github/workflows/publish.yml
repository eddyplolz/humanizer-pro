name: Publish to PyPI

# Uploads the package for a GitHub release. The Release workflow creates the
# release once CI is green on main for a new version and then starts this
# workflow by name, because a release created with the workflow token does
# not fire the release event on its own. Every upload corresponds to a
# tested, tagged commit. Authentication is PyPI trusted publishing: no token
# is stored in the repository.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example v4.15.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build the distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A full tag ref, so a manual run cannot build a branch that shares
          # the tag's name.
          ref: refs/tags/${{ inputs.tag || github.event.release.tag_name }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install build==1.6.1
          python -m build
      - name: Check the version matches the tag
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          version="$(python3 -c "import ast; t=ast.parse(open('scripts/humanizer_audit.py').read()); print(next(n.value.value for n in t.body if isinstance(n, ast.Assign) and getattr(n.targets[0], 'id', '') == '__version__'))")"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::package version $version does not match release tag $TAG"
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/humanizer-pro
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
