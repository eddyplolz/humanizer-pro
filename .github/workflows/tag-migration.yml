name: Tag migration (one-time)

# Main's history was rewritten to remove private details, which gave every
# commit a new ID. This moves each release tag to the rewritten commit listed
# in .github/tag-migration.json. It runs once, when that file lands on main,
# and both files are deleted afterwards.
on:
  push:
    branches: [main]
    paths: [.github/tag-migration.json]

permissions:
  contents: write

jobs:
  move-tags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move each tag to its rewritten commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          import json, subprocess
          def git(*args):
              return subprocess.run(["git", *args], check=True, capture_output=True, text=True).stdout
          tags = json.load(open(".github/tag-migration.json"))["tags"]
          for tag in tags:
              name, sha = tag["tag"], tag["sha"]
              git("cat-file", "-e", f"{sha}^{{commit}}")
              # Only ever point a tag at a commit that is part of main.
              git("merge-base", "--is-ancestor", sha, "HEAD")
              if tag["annotated"]:
                  git("tag", "-f", "-a", name, sha, "-m", tag["message"])
              else:
                  git("tag", "-f", name, sha)
              git("push", "--force", "origin", f"refs/tags/{name}")
              print(f"{name} -> {sha[:7]}")
          PY
