[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "humanizer-audit"
dynamic = ["version"]
description = "Deterministic, zero-dependency audit for AI-writing tells, leaked chatbot artifacts, and rewrite fidelity."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Humanizer Pro contributors" }]
keywords = ["ai-writing", "linter", "prose", "markdown", "sarif"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
]
# Zero runtime dependencies, by design.
dependencies = []

[project.scripts]
humanizer-audit = "humanizer_audit:main"

[project.urls]
Homepage = "https://github.com/eddyplolz/humanizer-pro"

[tool.setuptools]
# Ship only the audit CLI. The corpus and measurement scripts are maintainer
# tools that run from a checkout.
package-dir = { "" = "scripts" }
py-modules = ["humanizer_audit"]

[tool.setuptools.dynamic]
version = { attr = "humanizer_audit.__version__" }
